<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מעקב סגירות · פסגה בתנועה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pg-orange:#F9A349; --pg-turquoise:#6ECBD9; --pg-coral:#F16E60; --pg-deep-teal:#52A9B6;
  --pg-orange-ink:#A85410; --pg-teal-ink:#256069; --pg-coral-ink:#A82E20; --pg-teal-solid:#2E7580;
  --pg-text:#2A2B2D; --pg-body:#4A4C4F; --pg-muted:#6B6E71;
  --pg-on-orange:#3D2A12; --pg-on-turquoise:#123338;
  --pg-tint:#DDE8EB; --pg-orange-tint:#FEF6EC; --pg-teal-tint:#EDF9FB;
  --pg-surface:#F7F8F8; --pg-border:#E3E6E7; --pg-bg:#FFFFFF;
  --head:'Rubik','Assistant','Arial Hebrew',sans-serif;
  --body:'Assistant','Rubik','Arial Hebrew',sans-serif;
  --r-sm:8px; --r:16px; --r-lg:24px;
  --shadow:0 2px 8px rgba(37,96,105,.08),0 12px 32px rgba(37,96,105,.06);
  /* סטטוסים */
  --st-new-bg:#FBE3E1; --st-new-fg:#8F2A1E;
  --st-sent-bg:#FFF4D6; --st-sent-fg:#7A5300;
  --st-coord-bg:#FDE8D2; --st-coord-fg:#8A4510;
  --st-closed-bg:#DCEEFA; --st-closed-fg:#1D5279;
  --st-done-bg:#DDF1E1; --st-done-fg:#1F6630;
  --st-off-bg:#ECEEEF; --st-off-fg:#5E6366;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pg-bg:#16191B; --pg-surface:#1F2325; --pg-border:#33383B;
    --pg-tint:#1A2124; --pg-orange-tint:#2A1F14; --pg-teal-tint:#14262A;
    --pg-text:#F2F4F4; --pg-body:#C9CCCE; --pg-muted:#9BA0A3;
    --pg-orange-ink:#F9A349; --pg-teal-ink:#6ECBD9; --pg-coral-ink:#F16E60;
    --st-new-bg:#3A1F1C; --st-new-fg:#F5B3AA;
    --st-sent-bg:#352C14; --st-sent-fg:#F3D27A;
    --st-coord-bg:#3A2816; --st-coord-fg:#F6BF85;
    --st-closed-bg:#16283A; --st-closed-fg:#9CCBF0;
    --st-done-bg:#18301E; --st-done-fg:#9BDBA9;
    --st-off-bg:#272B2E; --st-off-fg:#A3A8AB;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--pg-tint);color:var(--pg-body);font-family:var(--body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);color:var(--pg-text);margin:0;line-height:1.3}

/* כותרת */
.top{background:var(--pg-bg);border-bottom:1px solid var(--pg-border)}
.top-in{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.logo{height:48px;width:auto;flex:none}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.3rem;font-weight:700}
.brand .sub{font-size:.875rem;color:var(--pg-muted);font-weight:600}
.top-actions{display:flex;gap:8px;align-items:center}
.user{font-size:.875rem;color:var(--pg-muted);font-weight:600;white-space:nowrap}
.seam{height:4px;background:linear-gradient(to left,var(--pg-orange) 50%,var(--pg-turquoise) 50%)}

.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;font-size:.95rem}
.btn-primary{background:var(--pg-orange);color:var(--pg-on-orange)}
.btn-primary:hover{filter:brightness(.96)}
.btn-ghost{background:transparent;color:var(--pg-teal-ink);border:1.5px solid var(--pg-border)}
.btn-ghost:hover{background:var(--pg-teal-tint)}
.btn-teal{background:var(--pg-teal-solid);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:0;background:transparent;cursor:pointer;width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--pg-body);font-size:1.3rem}
.icon-btn:hover{background:var(--pg-surface)}

main{max-width:1200px;margin:0 auto;padding:20px 16px 64px}

/* מונים */
.stats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.stat{flex:1 0 auto;min-width:108px;background:var(--pg-bg);border:1.5px solid transparent;border-radius:var(--r);padding:10px 14px;text-align:start;cursor:pointer;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--head);font-size:1.6rem;color:var(--pg-text);line-height:1.2}
.stat span{font-size:.85rem;font-weight:600;color:var(--pg-muted)}
.stat .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.stat.on{border-color:var(--pg-teal-solid)}

/* לשוניות */
.tabs{display:flex;gap:4px;margin:22px 0 12px;border-bottom:1.5px solid var(--pg-border);overflow-x:auto}
.tab{border:0;background:none;padding:10px 16px;font-family:var(--head);font-weight:600;font-size:1rem;color:var(--pg-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab.on{color:var(--pg-teal-ink);border-bottom-color:var(--pg-turquoise)}
.tab .n{display:inline-block;min-width:22px;padding:0 7px;border-radius:999px;background:var(--pg-orange);color:var(--pg-on-orange);font-size:.8rem;margin-inline-start:6px;font-family:var(--body);font-weight:700}

/* סינון */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filters input[type=search],.filters select{background:var(--pg-bg);border:1.5px solid var(--pg-border);border-radius:999px;padding:8px 14px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.filters select{flex:0 1 220px}
.chk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.95rem;cursor:pointer;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--pg-teal-solid)}
.clear{border:0;background:none;color:var(--pg-teal-ink);font-weight:700;cursor:pointer;text-decoration:underline}

/* כרטיסים */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--pg-bg);border:1px solid var(--pg-border);border-radius:var(--r);padding:14px 16px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-1px);border-color:var(--pg-turquoise)}
.card:focus-visible{outline:3px solid var(--pg-turquoise);outline-offset:2px}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.c-school{font-family:var(--head);font-weight:600;font-size:1.1rem;color:var(--pg-text);line-height:1.35}
.c-ws{font-weight:600;color:var(--pg-teal-ink);font-size:.98rem;line-height:1.4}
.c-meta{font-size:.88rem;color:var(--pg-muted);font-weight:600}
.reason{font-size:.85rem;font-weight:700;color:var(--pg-coral-ink);background:var(--pg-orange-tint);border-radius:var(--r-sm);padding:4px 10px;align-self:flex-start}
.reason.soft{color:var(--pg-teal-ink);background:var(--pg-teal-tint)}
.fb{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;border:1.5px dashed var(--pg-coral-ink);background:var(--pg-orange-tint);color:var(--pg-coral-ink);border-radius:999px;padding:3px 12px 3px 10px;font-weight:700;font-size:.85rem;cursor:pointer}
.fb .box{width:16px;height:16px;border-radius:4px;border:2px solid currentColor;display:grid;place-items:center;font-size:.75rem;line-height:1}
.fb.on{border-style:solid;border-color:transparent;background:var(--st-done-bg);color:var(--st-done-fg)}
.fb.on .box{background:var(--st-done-fg);color:var(--pg-bg);border-color:var(--st-done-fg)}
.fb:hover{filter:brightness(.97)}
.ev-end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

.pill{display:inline-block;border-radius:999px;padding:2px 11px;font-size:.82rem;font-weight:700;white-space:nowrap}
.st-0{background:var(--st-new-bg);color:var(--st-new-fg)}
.st-1{background:var(--st-sent-bg);color:var(--st-sent-fg)}
.st-2{background:var(--st-coord-bg);color:var(--st-coord-fg)}
.st-3{background:var(--st-closed-bg);color:var(--st-closed-fg)}
.st-4{background:var(--st-done-bg);color:var(--st-done-fg)}
.st-5,.st-6{background:var(--st-off-bg);color:var(--st-off-fg)}
.dot.st-0{background:var(--st-new-fg)} .dot.st-1{background:#D9A400} .dot.st-2{background:var(--pg-orange)}
.dot.st-3{background:#3B87C4} .dot.st-4{background:#3E9C55} .dot.st-5{background:#9BA0A3}

/* מפגשים */
.month{font-family:var(--head);font-weight:600;font-size:1.1rem;color:var(--pg-text);margin:22px 0 10px}
.month:first-child{margin-top:4px}
.ev{display:flex;gap:14px;align-items:stretch;background:var(--pg-bg);border:1px solid var(--pg-border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer;text-align:start;width:100%;box-shadow:var(--shadow)}
.ev:hover{border-color:var(--pg-turquoise)}
.ev-date{flex:none;width:62px;border-radius:12px;background:var(--pg-teal-tint);color:var(--pg-teal-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ev-date b{font-family:var(--head);font-size:1.5rem}
.ev-date span{font-size:.8rem;font-weight:700}
.ev.past .ev-date{background:var(--pg-surface);color:var(--pg-muted)}
.ev-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-end{flex:none;align-self:center}

.empty{text-align:center;padding:48px 16px;color:var(--pg-muted);font-weight:600}
.empty b{display:block;font-family:var(--head);font-size:1.2rem;color:var(--pg-text);margin-bottom:4px}

/* מגירה */
.veil{position:fixed;inset:0;background:rgba(18,30,33,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(520px,100%);background:var(--pg-bg);z-index:21;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.d-head{padding:16px 20px 12px;border-bottom:1px solid var(--pg-border);display:flex;gap:10px;align-items:flex-start}
.d-head .t{flex:1;min-width:0}
.d-head h2{font-size:1.3rem}
.d-head .ws{color:var(--pg-teal-ink);font-weight:700}
.d-body{flex:1;overflow-y:auto;padding:16px 20px 24px}
.d-foot{padding:12px 20px;border-top:1px solid var(--pg-border);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--pg-bg)}
.d-foot .sp{flex:1}
.sec{margin-bottom:22px}
.sec h3{font-size:1rem;font-weight:600;color:var(--pg-teal-ink);margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid var(--pg-teal-tint)}
.contact{background:var(--pg-surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.contact .name{font-weight:700;color:var(--pg-text)}
.c-links{display:flex;gap:6px;flex-wrap:wrap}
.c-links a{font-size:.88rem;font-weight:700;color:var(--pg-teal-ink);background:var(--pg-bg);border:1px solid var(--pg-border);border-radius:999px;padding:4px 12px;text-decoration:none}
.c-links a:hover{border-color:var(--pg-turquoise)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem;margin-top:10px}
.facts dt{color:var(--pg-muted);font-weight:600}
.facts dd{margin:0;color:var(--pg-text)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.88rem;font-weight:700;color:var(--pg-body)}
.f input,.f select,.f textarea{background:var(--pg-bg);border:1.5px solid var(--pg-border);border-radius:var(--r-sm);padding:8px 10px;width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--pg-deep-teal);box-shadow:0 0 0 3px var(--pg-teal-tint)}
.f .chk{padding-top:6px}
.status-row{display:flex;flex-wrap:wrap;gap:6px}
.status-row button{border:1.5px solid var(--pg-border);background:var(--pg-bg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--pg-body)}
.status-row button.on{border-color:currentColor}
.dirty{font-size:.85rem;color:var(--pg-orange-ink);font-weight:700}
.updated{font-size:.82rem;color:var(--pg-muted)}

.toast{position:fixed;inset-inline-start:50%;bottom:20px;transform:translateX(50%) translateY(20px);background:var(--pg-text);color:var(--pg-bg);padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.2s;z-index:40;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(50%) translateY(0)}
.toast.err{background:#A82E20;color:#fff}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:64px;color:var(--pg-muted);font-weight:700}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--pg-teal-tint);border-top-color:var(--pg-deep-teal);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.demo{background:var(--pg-orange-tint);color:var(--pg-orange-ink);font-weight:700;text-align:center;padding:6px 16px;font-size:.9rem}

@media (max-width:640px){
  .logo{height:38px}
  .brand h1{font-size:1.1rem}
  .user,.hide-sm{display:none}
  .grid{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .drawer{width:100%}
  .filters select{flex:1 1 140px}
}
</style>
</head>

    <label class="chk" id="pastWrap" hidden><input type="checkbox" id="fPast"> כולל מפגשים שעברו</label>
    <button class="clear" id="clear" hidden>ניקוי סינון</button>
  </div>

  <section id="list"><div class="loading"><div class="spin"></div>טוען נתונים מהגיליון…</div></section>
</main>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="d-head">
    <div class="t">
      <h2 id="dTitle"></h2>
      <div class="ws" id="dWs"></div>
    </div>
    <button class="icon-btn" id="dClose" aria-label="סגירה">✕</button>
  </div>
  <div class="d-body" id="dBody"></div>
  <div class="d-foot">
    <button class="btn btn-primary" id="dSave">שמירה</button>
    <a class="btn btn-ghost" id="dCal" target="_blank" rel="noopener" hidden>הוספה ליומן</a>
    <span class="sp"></span>
    <span class="dirty" id="dDirty" hidden>יש שינויים שלא נשמרו</span>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ======== מצב ======== */
const STATUSES = ['טרם טופל','נשלח מענה ראשוני','בתיאום','נסגר','התקיים','נדחה / לא רלוונטי','בוטל'];
const S = { rows:[], workshops:[], user:{email:'',name:''}, tab:'todo', status:'', q:'', ws:'', fac:'', mine:false, past:false };
let cur = null;       // השורה שפתוחה במגירה
let orig = null;      // ערכים מקוריים לזיהוי שינויים
let isNew = false;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stIdx = s => { const i = STATUSES.indexOf(s); return i < 0 ? 0 : Math.min(i, 6); };
const pill = s => '<span class="pill st-' + stIdx(s) + '">' + esc(s || 'טרם טופל') + '</span>';

/* ======== שרת ======== */
const DEMO = typeof google === 'undefined' || !google.script;
function call(fn){
  const args = Array.prototype.slice.call(arguments, 1);
  if (DEMO) return demoCall(fn, args);
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e && e.message ? e : new Error(String(e))))[fn].apply(null, args);
  });
}

/* ======== תאריכים ======== */
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
function parseD(s){ const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
const DAYS = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function fmtD(s, withDay){
  const d = parseD(s); if (!d) return s || '';
  return (withDay ? 'יום ' + DAYS[d.getDay()] + ' ' : '') + d.getDate() + '.' + (d.getMonth()+1) + '.' + String(d.getFullYear()).slice(2);
}
const daysFrom = s => { const d = parseD(s); return d ? Math.round((d - today()) / 864e5) : null; };
const timeRange = r => r.start ? '<bdi dir="ltr">' + esc(r.start) + (r.end ? '–' + esc(r.end) : '') + '</bdi>' : '';

/* ======== מה דורש טיפול ======== */
function reasons(r){
  const out = [], st = r.status || 'טרם טופל', dd = daysFrom(r.finalDate);
  const since = daysFrom((r.updatedAt || r.regDate || '').slice(0,10));
  if (st === 'טרם טופל') out.push({ p:1, t:'עוד לא נוצר קשר' });
  if (st === 'נשלח מענה ראשוני' && since !== null && since <= -10) out.push({ p:3, t:'אין התקדמות כבר ' + (-since) + ' ימים' });
  if (st === 'בתיאום' && since !== null && since <= -7) out.push({ p:3, t:'בתיאום כבר ' + (-since) + ' ימים' });
  if (st === 'נסגר' && !r.finalDate) out.push({ p:1, t:'נסגר בלי תאריך' });
  if (st === 'נסגר' && dd !== null && dd < 0) out.push({ p:2, t:'התאריך עבר: לעדכן ל"התקיים"' });
  if (st === 'נסגר' && dd !== null && dd >= 0 && dd <= 7) out.push({ p:4, t: dd === 0 ? 'המפגש היום' : 'המפגש בעוד ' + dd + ' ימים', soft:true });
  if (st === 'התקיים' && !r.feedbackSent) out.push({ p:2, t:'לשלוח משוב' });
  return out.sort((a,b) => a.p - b.p);
}

/* ======== סינון ======== */
function isMine(r){
  return !!S.user.name && String(r.facilitator || '').indexOf(S.user.name) >= 0;
}
function filtered(ignoreStatus){
  const q = S.q.trim().toLowerCase();
  return S.rows.filter(r => {
    if (S.ws && r.workshop !== S.ws) return false;
    if (S.fac && String(r.facilitator||'').indexOf(S.fac) < 0) return false;
    if (S.mine && !isMine(r)) return false;
    if (!ignoreStatus && S.status){
      const st = r.status || 'טרם טופל';
      if (S.status === '__off' ? ['נדחה / לא רלוונטי','בוטל'].indexOf(st) < 0 : st !== S.status) return false;
    }
    if (q && [r.school, r.contact, r.workshop, r.facilitator, r.email, r.phone, r.notes].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

/* ======== ציור ======== */
function render(){
  renderStats();
  $('#todoN').textContent = filtered(true).filter(r => reasons(r).some(x => !x.soft)).length;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  $('#pastWrap').hidden = S.tab !== 'cal';
  $('#clear').hidden = !(S.q || S.ws || S.fac || S.mine || S.status);

  const L = $('#list');
  if (S.tab === 'todo'){
    const rows = filtered().map(r => ({ r, rs: reasons(r) })).filter(x => x.rs.length)
      .sort((a,b) => a.rs[0].p - b.rs[0].p || (a.r.workshop||'').localeCompare(b.r.workshop||'', 'he'));
    L.innerHTML = rows.length ? '<div class="grid">' + rows.map(x => card(x.r, x.rs)).join('') + '</div>'
      : empty('אין כרגע משימות פתוחות', 'כל הסגירות מעודכנות.');
  } else if (S.tab === 'all'){
    const rows = filtered().slice().sort((a,b) => (a.workshop||'').localeCompare(b.workshop||'', 'he') || (a.school||'').localeCompare(b.school||'', 'he'));
    L.innerHTML = rows.length ? '<div class="grid">' + rows.map(r => card(r)).join('') + '</div>' : empty('לא נמצאו סגירות', 'אפשר לשנות את הסינון.');
  } else {
    renderCal(L);
  }
}

function renderStats(){
  const base = filtered(true);
  const counts = STATUSES.map(s => base.filter(r => (r.status || 'טרם טופל') === s).length);
  const items = [{ s:'', n:base.length, label:'הכל' }].concat(STATUSES.slice(0,5).map((s,i) => ({ s, n:counts[i], label:s, i })));
  const off = counts[5] + counts[6];
  if (off) items.push({ s:'__off', n:off, label:'נדחו / בוטלו', i:5 });
  $('#stats').innerHTML = items.map(x =>
    '<button class="stat' + (S.status === x.s ? ' on' : '') + '" data-st="' + esc(x.s) + '"><b>' + x.n + '</b><span>' +
    (x.i !== undefined ? '<i class="dot st-' + x.i + '"></i>' : '') + esc(x.label) + '</span></button>').join('');
}

function card(r, rs){
  rs = rs || [];
  const when = r.finalDate ? fmtD(r.finalDate, true) + (r.start ? ' · ' + timeRange(r) : '')
    : (r.preferred ? 'מועדף: ' + esc(fmtD(r.preferred)) : 'ללא תאריך');
  const meta = [esc(r.facilitator || 'ללא מנחה'), when, r.registered ? esc(r.registered) + ' משתתפים' : ''].filter(Boolean).join(' | ');
  return '<div class="card" role="button" tabindex="0" data-key="' + esc(r.key) + '">' +
    '<div class="c-top"><span class="c-school">' + esc(r.workshop) + '</span>' + pill(r.status) + '</div>' +
    '<div class="c-ws">' + esc(r.school) + '</div>' +
    '<div class="c-meta">' + meta + '</div>' +
    rs.filter(x => x.t !== 'לשלוח משוב').map(x => '<span class="reason' + (x.soft ? ' soft' : '') + '">' + esc(x.t) + '</span>').join('') +
    fbToggle(r) +
    '</div>';
}

/* סימון מהיר "משוב נשלח" — מופיע בסגירות שהתקיימו */
function fbToggle(r){
  if (r.status !== 'התקיים') return '';
  return '<button type="button" class="fb' + (r.feedbackSent ? ' on' : '') + '" data-fb="' + esc(r.key) + '" aria-pressed="' + !!r.feedbackSent + '">' +
    '<span class="box">' + (r.feedbackSent ? '✓' : '') + '</span>' + (r.feedbackSent ? 'משוב נשלח' : 'משוב טרם נשלח · לסמן') + '</button>';
}
async function toggleFb(key, btn){
  const r = S.rows.find(x => x.key === key); if (!r) return;
  btn.disabled = true;
  try {
    const nr = await call('saveRow', key, { feedbackSent: !r.feedbackSent });
    Object.assign(r, nr);
    toast(r.feedbackSent ? 'סומן: משוב נשלח' : 'הסימון בוטל');
    render();
  } catch (e){ toast('השמירה נכשלה: ' + (e.message || e), true); btn.disabled = false; }
}

function renderCal(L){
  const t = today();
  let rows = filtered().filter(r => r.finalDate && ['בוטל','נדחה / לא רלוונטי'].indexOf(r.status) < 0);
  if (!S.past) rows = rows.filter(r => parseD(r.finalDate) >= t);
  rows.sort((a,b) => (a.finalDate + (a.start||'')).localeCompare(b.finalDate + (b.start||'')));
  const noDate = filtered().filter(r => !r.finalDate && ['נסגר','בתיאום'].indexOf(r.status) >= 0).length;
  if (!rows.length){
    L.innerHTML = empty('אין מפגשים עם תאריך סופי', noDate ? noDate + ' סגירות בתיאום או סגורות עדיין בלי תאריך.' : 'כשתוזן לסגירה תאריך סופי, היא תופיע כאן.');
    return;
  }
  let html = '', lastM = '';
  rows.forEach(r => {
    const d = parseD(r.finalDate), m = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    if (m !== lastM){ html += '<h3 class="month">' + m + '</h3>'; lastM = m; }
    html += '<div class="ev' + (d < t ? ' past' : '') + '" role="button" tabindex="0" data-key="' + esc(r.key) + '">' +
      '<div class="ev-date"><b>' + d.getDate() + '</b><span>יום ' + DAYS[d.getDay()] + '</span></div>' +
      '<div class="ev-body"><span class="c-school">' + esc(r.workshop) + '</span><span class="c-ws">' + esc(r.school) + '</span>' +
      '<span class="c-meta">' + [esc(r.facilitator), timeRange(r), esc(r.location)].filter(Boolean).join(' | ') + '</span></div>' +
      '<div class="ev-end">' + pill(r.status) + fbToggle(r) + '</div></div>';
  });
  if (noDate) html += '<p class="c-meta" style="margin-top:16px">' + noDate + ' סגירות בתיאום או סגורות עדיין בלי תאריך סופי.</p>';
  L.innerHTML = html;
}

const empty = (t, s) => '<div class="empty"><b>' + esc(t) + '</b>' + esc(s) + '</div>';

function fillFilters(){
  const wsNames = Array.from(new Set(S.workshops.map(w => w.name).concat(S.rows.map(r => r.workshop)).filter(Boolean))).sort((a,b) => a.localeCompare(b,'he'));
  const facs = facilitatorList();
  $('#fWs').innerHTML = '<option value="">כל הסדנאות</option>' + wsNames.map(w => '<option' + (w === S.ws ? ' selected' : '') + '>' + esc(w) + '</option>').join('');
  $('#fFac').innerHTML = '<option value="">כל המנחים</option>' + facs.map(f => '<option' + (f === S.fac ? ' selected' : '') + '>' + esc(f) + '</option>').join('');
  $('#mineWrap').hidden = !S.user.name || !S.rows.some(isMine);
}
function facilitatorList(){
  const set = new Set();
  S.workshops.map(w => w.facilitator).concat(S.rows.map(r => r.facilitator)).forEach(f =>
    String(f||'').split('/').map(x => x.trim()).filter(Boolean).forEach(x => set.add(x)));
  return Array.from(set).sort((a,b) => a.localeCompare(b,'he'));
}

/* ======== מגירה ======== */
function openRow(key){
  const r = S.rows.find(x => x.key === key); if (!r) return;
  isNew = false; cur = r; orig = Object.assign({}, r);
  $('#dTitle').textContent = r.workshop;
  $('#dWs').textContent = r.school;
  $('#dBody').innerHTML = drawerBody(r);
  bindDrawer();
  showDrawer(true);
}

function openNew(){
  isNew = true;
  cur = { status:'בתיאום', feedbackSent:false };
  orig = Object.assign({}, cur);
  $('#dTitle').textContent = 'סגירה חדשה';
  $('#dWs').textContent = 'לבית ספר שפנה בטלפון, במייל או בכל דרך אחרת';
  const wsNames = S.workshops.map(w => w.name);
  $('#dBody').innerHTML =
    '<div class="sec"><h3>בית הספר</h3><div class="form">' +
      fld('school','שם בית הספר','text','full') +
      '<div class="f full"><label for="f-workshop">סדנה</label><select id="f-workshop" data-f="workshop"><option value="">בחירה…</option>' +
        wsNames.map(w => '<option>' + esc(w) + '</option>').join('') + '</select></div>' +
      fld('contact','איש/אשת קשר','text') + fld('phone','טלפון','tel') +
      fld('email','אימייל','email') + fld('registered','מספר משתתפים','number') +
    '</div></div>' + coordSection(cur);
  bindDrawer();
  showDrawer(true);
  setTimeout(() => { const i = $('#f-school'); if (i) i.focus(); }, 250);
}

function fld(f, label, type, cls, extra){
  const v = cur[f] == null ? '' : cur[f];
  if (type === 'textarea') return '<div class="f ' + (cls||'') + '"><label for="f-' + f + '">' + label + '</label><textarea id="f-' + f + '" data-f="' + f + '">' + esc(v) + '</textarea></div>';
  return '<div class="f ' + (cls||'') + '"><label for="f-' + f + '">' + label + '</label><input id="f-' + f + '" data-f="' + f + '" type="' + type + '" value="' + esc(v) + '"' + (extra||'') + '></div>';
}

function coordSection(r){
  return '<div class="sec"><h3>סטטוס ותיאום</h3>' +
    '<div class="status-row" id="stRow">' + STATUSES.map((s,i) => '<button type="button" data-s="' + esc(s) + '" class="' + ((r.status||'טרם טופל') === s ? 'on st-' + Math.min(i,6) : '') + '">' + esc(s) + '</button>').join('') + '</div>' +
    '<div class="form" style="margin-top:14px">' +
      fld('finalDate','תאריך סופי','date') +
      '<div class="f"><label for="f-facilitator">מנחה</label><input id="f-facilitator" data-f="facilitator" list="facList" value="' + esc(r.facilitator||'') + '"></div>' +
      fld('start','שעת התחלה','time') + fld('end','שעת סיום','time') +
      fld('location','מיקום','text','full', ' placeholder="למשל: חדר מורים, בית הספר"') +
      fld('notes','הערות תיאום','textarea','full') +
    '</div><datalist id="facList">' + facilitatorList().map(f => '<option value="' + esc(f) + '">').join('') + '</datalist></div>';
}

function drawerBody(r){
  const phone = String(r.phone||'').replace(/\D/g,'');
  const wa = phone ? '972' + phone.replace(/^0/,'') : '';
  const links = [
    phone ? '<a href="tel:' + esc(phone) + '">📞 ' + esc(r.phone) + '</a>' : '',
    wa ? '<a href="https://wa.me/' + wa + '" target="_blank" rel="noopener">וואטסאפ</a>' : '',
    r.email ? '<a href="mailto:' + esc(r.email) + '?subject=' + encodeURIComponent('פסגה בתנועה: ' + r.workshop) + '">✉ ' + esc(r.email) + '</a>' : ''
  ].filter(Boolean).join('');
  const facts = [
    ['תאריך מועדף', r.preferred ? fmtD(r.preferred, true) : ''],
    ['משתתפים רשומים', r.registered],
    ['הערות בית הספר', r.schoolNotes],
    ['נרשם ב-', r.regDate ? fmtD(r.regDate.slice(0,10)) : '']
  ].filter(x => x[1]);
  const upd = r.updatedAt ? 'עודכן ' + fmtD(r.updatedAt.slice(0,10)) + ' ' + r.updatedAt.slice(11,16) + (r.updatedBy ? ' ע"י ' + r.updatedBy.split('@')[0] : '') : '';
  return '<div class="sec"><div class="contact">' +
      '<span class="name">' + esc(r.contact || 'ללא איש קשר') + '</span>' +
      (links ? '<div class="c-links">' + links + '</div>' : '') +
    '</div>' +
    (facts.length ? '<dl class="facts">' + facts.map(f => '<dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd>').join('') + '</dl>' : '') +
    '</div>' + coordSection(r) +
    '<div class="sec"><h3>אחרי המפגש</h3><div class="form">' +
      fld('actual','משתתפים בפועל','number','', ' min="0"') +
      fld('score','ציון משוב ממוצע (1-5)','number','', ' min="1" max="5" step="0.1"') +
      '<div class="f full"><label class="chk"><input type="checkbox" id="f-feedbackSent" data-f="feedbackSent"' + (r.feedbackSent ? ' checked' : '') + '> שאלון משוב נשלח לבית הספר</label></div>' +
      fld('insights','תובנות מהמשוב','textarea','full') +
    '</div></div>' +
    (upd ? '<div class="updated">' + esc(upd) + '</div>' : '');
}

function bindDrawer(){
  $('#dBody').querySelectorAll('[data-f]').forEach(el => {
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
      cur[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
      if (isNew && el.dataset.f === 'workshop'){
        const w = S.workshops.find(x => x.name === el.value);
        if (w && !cur.facilitator){ cur.facilitator = w.facilitator; $('#f-facilitator').value = w.facilitator; }
      }
      onChange();
    });
  });
  $('#stRow').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    cur.status = b.dataset.s;
    $('#stRow').querySelectorAll('button').forEach(x => { x.className = ''; });
    b.className = 'on st-' + stIdx(b.dataset.s);
    onChange();
  }));
  onChange();
}

function diff(){
  const ch = {};
  Object.keys(cur).forEach(k => { if (String(cur[k] == null ? '' : cur[k]) !== String(orig[k] == null ? '' : orig[k])) ch[k] = cur[k]; });
  return ch;
}
function onChange(){
  const n = Object.keys(diff()).length;
  $('#dDirty').hidden = isNew || !n;
  $('#dSave').disabled = isNew ? !(cur.school && cur.workshop) : !n;
  $('#dSave').textContent = isNew ? 'הוספה' : 'שמירה';
  const cal = calLink(cur);
  $('#dCal').hidden = !cal || isNew;
  if (cal) $('#dCal').href = cal;
}

function calLink(r){
  const d = parseD(r.finalDate); if (!d) return '';
  const p = n => String(n).padStart(2,'0');
  const ymd = d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
  let dates;
  if (r.start){
    const st = r.start.replace(':','') + '00';
    const en = (r.end || (p((+r.start.slice(0,2) + 2) % 24) + r.start.slice(2))).replace(':','') + '00';
    dates = ymd + 'T' + st + '/' + ymd + 'T' + en;
  } else {
    const n = new Date(d); n.setDate(n.getDate()+1);
    dates = ymd + '/' + n.getFullYear() + p(n.getMonth()+1) + p(n.getDate());
  }
  const details = ['פסגה בתנועה', 'מנחה: ' + (r.facilitator||''), 'איש קשר: ' + (r.contact||'') + ' ' + (r.phone||''), r.notes||''].filter(Boolean).join('\n');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=Asia/Jerusalem' +
    '&text=' + encodeURIComponent(r.workshop + ' · ' + r.school) + '&dates=' + dates +
    '&details=' + encodeURIComponent(details) + '&location=' + encodeURIComponent(r.location || r.school || '');
}

function showDrawer(on){
  $('#drawer').classList.toggle('on', on);
  $('#veil').classList.toggle('on', on);
  $('#drawer').setAttribute('aria-hidden', on ? 'false' : 'true');
  if (!on){ cur = null; orig = null; }
}
function tryClose(){
  if (cur && !isNew && Object.keys(diff()).length && !confirm('יש שינויים שלא נשמרו. לסגור בלי לשמור?')) return;
  showDrawer(false);
}

async function save(){
  const btn = $('#dSave'); btn.disabled = true; btn.textContent = 'שומר…';
  try {
    if (isNew){
      const r = await call('addRow', cur);
      S.rows.push(r);
      toast('הסגירה נוספה');
    } else {
      const ch = diff();
      const r = await call('saveRow', cur.key, ch);
      const i = S.rows.findIndex(x => x.key === r.key);
      if (i >= 0) S.rows[i] = r;
      toast('נשמר בגיליון');
    }
    showDrawer(false);
    fillFilters(); render();
  } catch (e){
    toast('השמירה נכשלה: ' + (e.message || e), true);
    btn.disabled = false; btn.textContent = isNew ? 'הוספה' : 'שמירה';
  }
}

/* ======== טעינה ======== */
async function load(silent){
  if (!silent) $('#list').innerHTML = '<div class="loading"><div class="spin"></div>טוען נתונים מהגיליון…</div>';
  try {
    const d = await call('getData');
    S.rows = d.rows; S.workshops = d.workshops; S.user = d.user || S.user;
    $('#user').textContent = S.user.name || S.user.email || '';
    fillFilters(); render();
    if (silent) toast('הנתונים עודכנו');
  } catch (e){
    $('#list').innerHTML = empty('לא הצלחנו לטעון את הנתונים', e.message || String(e));
  }
}

let tt;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), err ? 5000 : 2200);
}

/* ======== אירועים ======== */
document.addEventListener('click', e => {
  const fb = e.target.closest('[data-fb]'); if (fb){ e.stopPropagation(); toggleFb(fb.dataset.fb, fb); return; }
  const c = e.target.closest('[data-key]'); if (c && !e.target.closest('.drawer')) { openRow(c.dataset.key); return; }
  const st = e.target.closest('.stat');
  if (st){ S.status = S.status === st.dataset.st ? '' : st.dataset.st; if (S.tab === 'todo' && S.status) S.tab = 'all'; render(); return; }
  const tb = e.target.closest('.tab'); if (tb){ S.tab = tb.dataset.tab; render(); }
});
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#fWs').addEventListener('change', e => { S.ws = e.target.value; render(); });
$('#fFac').addEventListener('change', e => { S.fac = e.target.value; render(); });
$('#fMine').addEventListener('change', e => { S.mine = e.target.checked; render(); });
$('#fPast').addEventListener('change', e => { S.past = e.target.checked; render(); });
$('#clear').addEventListener('click', () => {
  S.q = S.ws = S.fac = S.status = ''; S.mine = false;
  $('#q').value = ''; $('#fMine').checked = false; fillFilters(); render();
});
$('#refresh').addEventListener('click', () => load(true));
$('#addBtn').addEventListener('click', openNew);
$('#dClose').addEventListener('click', tryClose);
$('#veil').addEventListener('click', tryClose);
$('#dSave').addEventListener('click', save);
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-key]')){ e.preventDefault(); openRow(e.target.dataset.key); return; } if (e.key === 'Escape' && $('#drawer').classList.contains('on')) tryClose(); });

/* ======== מצב הדגמה (כשהקובץ נפתח מחוץ ל-Apps Script) ======== */
function demoCall(fn, args){
  return new Promise((res) => setTimeout(() => {
    if (fn === 'getData') return res(demoData());
    if (fn === 'saveRow'){ const r = Object.assign({}, S.rows.find(x => x.key === args[0]), args[1], { updatedAt:new Date().toISOString().slice(0,16), updatedBy:'demo@pisgah.org.il' }); return res(r); }
    if (fn === 'addRow'){ return res(Object.assign({ key:'ידני|' + Date.now(), regDate:new Date().toISOString().slice(0,16) }, args[0])); }
  }, 350));
}

    ['הוגנות בחינוך בעולם משתנה','לימור לופו ולנסקי'],['חשיבה יצירתית ופתרון בעיות STEM','לימור לופו ולנסקי'],
    ['חמלה עצמית, חוסן והכרת הטוב','יפית אורבך'],['חשיבה יצירתית כמנוע לחדשנות פדגוגית','אדם גלבוע']];
  const R = (school, wi, status, o) => Object.assign({ key: school + '|' + wi, school, workshop:W[wi][0], facilitator:W[wi][1], status,
    contact:'איש קשר לדוגמה', phone:'050-0000000', email:'example@school.org.il', registered:'20', preferred:iso(30), regDate:iso(-25) + 'T10:00', feedbackSent:false }, o || {});
  return { user:{ email:'shira@pisgah.org.il', name:'שירה רוט זליקוביץ' }, workshops: W.map(w => ({ name:w[0], facilitator:w[1] })), rows:[
    R('בית ספר א', 2, 'טרם טופל', { regDate:iso(-5) + 'T09:00' }),
    R('בית ספר ב', 0, 'טרם טופל', { schoolNotes:'תאריך נוסף אפשרי בסוף השנה' }),
    R('בית ספר ג', 1, 'נשלח מענה ראשוני'),
    R('בית ספר ד', 3, 'בתיאום', { notes:'מחכים לאישור המנהלת', updatedAt:iso(-9) + 'T12:00' }),
    R('בית ספר ה', 4, 'נסגר', { finalDate:iso(3), start:'13:30', end:'15:00', location:'חדר מורים' }),
    R('בית ספר ו', 5, 'נסגר'),
    R('בית ספר ז', 6, 'נסגר', { finalDate:iso(-2), start:'14:00', end:'15:30' }),
    R('בית ספר ח', 1, 'התקיים', { finalDate:iso(-12), start:'13:00', end:'14:30', actual:'24' }),
    R('בית ספר ט', 0, 'התקיים', { finalDate:iso(-20), start:'12:00', end:'13:30', actual:'31', feedbackSent:true, score:'4.6', insights:'ביקשו מפגש המשך' }),
    R('בית ספר י', 3, 'נסגר', { finalDate:iso(18), start:'13:00', end:'14:30' }),
    R('בית ספר יא', 2, 'בוטל')
  ]};
}
if (DEMO) $('#demoBar').hidden = false;

load();
})();
